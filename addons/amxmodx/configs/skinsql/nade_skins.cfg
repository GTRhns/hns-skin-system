; ============================================================
; HnsMatchSkin 投掷物皮肤配置 (烟雾弹 / 闪光弹)
; 一行 = 一个皮肤
; 格式:  名字  模型路径  价格  类型
;   名字     : 唯一英文名 (菜单/数据库识别, 建议英文字母/数字)
;   模型路径 : 相对 models/ 的路径, 不含 .mdl
;   价格     : GBIC 金币价格, 0 = 免费 (前 N 个免费由 skins.cfg 的 nade_free 控制)
;   类型     : smoke = 烟雾弹   flash = 闪光弹
;
; 例: my_smoke  nade/my_smoke  500  smoke
;     my_flash  nade/my_flash  300  flash
;
; 前 nade_free 个 (按出现顺序) 免费, 其余按价格花 GBIC 购买。
; ============================================================

 ; 烟雾弹示例 (模型文件放 cstrike/models/nade/... 时把下面路径改好即可)
默认  nade/v_smokegrenade  0  smoke

;闪光弹示例
默认  nade/v_flashbang  0  flash

