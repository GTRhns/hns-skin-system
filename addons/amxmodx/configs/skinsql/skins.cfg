; ============================================================
;   HNS 皮肤系统 - 皮肤池配置文件 (T/CT 分区块)
; ------------------------------------------------------------
;  [SETTINGS]
; local = data/sqlite3/skinsql.sq3    mysql = skinsql/skinsql.cfg
storage local
;    rent_days      金币购买获得的租期天数, 0 = 直接永久
;    upgrade_price  把已购限时皮肤升级为永久的价格 (ICGB金币)
;    knife_free     刀皮里前 N 把免费 (按 KnifeModels.ini 出现顺序), 其余按 PRICE 花 GBIC
;    nade_free      投掷物皮肤里前 N 个免费 (按 nade_skins.cfg 出现顺序), 其余按价格花 GBIC
;    buy_gold_text  /skin 里「购买点数」显示的说明
;    buy_gold_url   可选, 填写后可打开购买页面 (MOTD)
;    checkin_bonus     每日签到奖励 GBIC, 默认 10
;    playtime_bonus    在线满 1 小时奖励 GBIC, 默认 5
;    playtime_seconds  在线奖励所需秒数, 默认 3600
;    precache_max   每张地图最多预缓存多少个皮肤模型 (CS1.6 模型池只有 512 个,
;                   且和地图的 *刷子模型共享)。重型 HNS 地图本身能吃掉 290+ 名额,
;                   预缓存太多会崩服 "Model '*N' ... over the 512 limit"。
;                   超过上限的皮肤仍进商店, 但本图显示[本图不可用], 换图可能就轮到它。
;                   0 = 不限制(危险, 老行为); 遇到崩服就调小 (例如 24/16), 稳了再加大。
;  区块:
;    [T] / [TT]  恐怖分子款
;    [CT]        反恐精英款
;
;  每款皮肤:
;    名字  模型路径  价格
;    wav 音效路径          ; 可选, 属于上一款; 可写多行, 死亡时随机一条
;
;  以后加死亡音效:
;    1. 把 wav 放到 cstrike/sound/ 下, 例如 cstrike/sound/skin/miku.wav
;    2. 在对应皮肤下一行写 (不要加分号):
;         wav skin/miku.wav
;    3. 同一款可写多行 wav, 死亡时从中随机; 多款也可复用同一个 wav
;    4. 换图/重启后生效
;
;  注意:
;    - 名字全服唯一, 定下后别改, 否则已购买记录会丢
;    - T/CT 重名的 CT 侧已加 (CT) 后缀: NALO / 人质 / 特工 / 天线宝宝
;    - 模型文件必须真实存在, 否则该款预缓存失败、不进池
;    - 玩家是 T 只显示 [T]; 是 CT 只显示 [CT]
; ============================================================

[SETTINGS]
; local = data/sqlite3/skinsql.sq3    mysql = skinsql/skinsql.cfg
storage local
rent_days  30
upgrade_price 2000
knife_free 1
nade_free 1
precache_max 0
checkin_bonus 10
playtime_bonus 5
playtime_seconds 3600
buy_gold_text 请联系管理员购买 GBIC 点数
;buy_gold_url http://example.com/buy

; T阵营皮肤
[T]
北极战士  models/player/arctic/arctic.mdl  0
; CT阵营皮肤
[CT]
德国GSG9  models/player/gsg9/gsg9.mdl  0