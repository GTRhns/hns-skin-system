; HnsSkin 玩家皮肤配置文件
; 格式: 显示名称 模型完整路径
;
; 身体模型路径: models/player/文件夹名/文件夹名.mdl
; 刀模型路径:   models/v_knife.mdl
; USP模型路径:  models/v_usp.mdl
; 烟雾弹皮肤:   models/v_smokegrenade*.mdl
; 闪光弹皮肤:   models/v_flashbang*.mdl
;
; 建议使用 CS 1.6 兼容模型路径，确保所有玩家都能看到
;
; 分区:
;   [T]     - 土匪阵营皮肤
;   [CT]    - 警察阵营皮肤
;   [Knife] - 刀皮肤
;   [USP]   - USP手枪皮肤
;   [Smoke] - 烟雾弹皮肤
;   [Flash] - 闪光弹皮肤
;
; 注意: 每个分区第一行为该类型的默认皮肤(新玩家自动拥有)。
;       主菜单 1-5 项会实时显示各分区内皮肤总数。
;       刀皮肤首行默认带 models/p_knife.mdl 作为第三人称展示模型。

; T阵营皮肤
[T]
北极战士 models/player/arctic/arctic.mdl
中东游击 models/player/guerilla/guerilla.mdl
精英部队 models/player/leet/leet.mdl
凤凰战士 models/player/terror/terror.mdl

; CT阵营皮肤
[CT]
德国GSG9 models/player/gsg9/gsg9.mdl
法国GIGN models/player/gign/gign.mdl
英国SAS models/player/sas/sas.mdl
美国城市特警 models/player/urban/urban.mdl

; 刀皮肤
; 格式: 名称 v_模型路径 [第三字段: 手动指定的第三人称 p_模型路径]
;   不写第三字段时, 第三人称展示复用第一人称模型。
[Knife]
默认刀 models/v_knife.mdl models/p_knife.mdl

; USP皮肤 (第一人称视角模型)
[USP]
默认USP models/v_usp.mdl

; 烟雾弹皮肤 (V_ 模型, 部署时显示; 第一行默认为原版)
[Smoke]
默认烟雾弹 models/v_smokegrenade.mdl
白色烟雾 models/v_smokegrenade_white.mdl

; 闪光弹皮肤 (V_ 模型)
[Flash]
默认闪光弹 models/v_flashbang.mdl
红色闪光 models/v_flashbang_red.mdl