; =====================================================
;  DLC 饰品配件扩展配置
;  DLC Accessory Extension Configuration
; =====================================================
; 
; 本插件扩展 HnsSkin 皮肤系统，为玩家添加饰品配件。
; 配置文件放在 addons/amxmodx/configs/mixsystem/dlc_accessory.ini
; 饰品模型文件放在 cstrike/models/ 目录下
;
; =====================================================
;  饰品槽位 (Slot) 说明
; =====================================================
; 每个槽位可以配多个饰品，玩家在每个槽位选一个
;
; 可用槽位:
;   hat     - 头部饰品 (帽子、头盔、圣诞帽等)
;   back    - 背部饰品 (翅膀、背包、降落伞等)
;   face    - 面部饰品 (眼镜、口罩等)
;
; =====================================================
;  格式说明
; =====================================================
; 格式: "显示名称" "模型路径" "坐标偏移X Y Z" "缩放比例"
;
; 坐标偏移 X Y Z: 饰品相对于玩家中心的位置
;   头部:   0 0 36  (头顶正上方)
;   背部:   -8 0 20 (背后)
;   面部:   0 0 30  (脸部)
;
; 缩放比例: 1.0 = 原始大小, 2.0 = 两倍大, 0.5 = 一半大
;
; =====================================================
;  [hat] - 头部饰品 (圣诞帽、头盔、角等)
; =====================================================
; 格式: "名称" "models/xxx.mdl" "X Y Z" "缩放"
;
; 示例:
;   "圣诞帽" "models/accessory/santa_hat.mdl" "0 0 36" "1.0"
;   "恶魔角" "models/accessory/devil_horn.mdl" "0 0 34" "1.0"
;   "天使光环" "models/accessory/halo.mdl" "0 0 38" "1.0"
;   "圣诞帽(金色)" "models/accessory/santa_hat_gold.mdl" "0 0 36" "1.2"

[hat]

; =====================================================
;  [back] - 背部饰品 (翅膀、背包、降落伞等)
; =====================================================
; 格式: "名称" "models/xxx.mdl" "X Y Z" "缩放"
;
; 示例:
;   "天使翅膀" "models/accessory/angel_wings.mdl" "-8 0 20" "1.0"
;   "恶魔翅膀" "models/accessory/devil_wings.mdl" "-8 0 20" "1.0"
;   "降落伞" "models/accessory/parachute.mdl" "-4 0 10" "1.0"
;   "蝴蝶翅膀" "models/accessory/butterfly_wings.mdl" "-8 0 18" "0.8"

[back]

; =====================================================
;  [face] - 面部饰品 (眼镜、口罩等)
; =====================================================
; 格式: "名称" "models/xxx.mdl" "X Y Z" "缩放"
;
; 示例:
;   "墨镜" "models/accessory/sunglasses.mdl" "0 0 32" "1.0"
;   "口罩" "models/accessory/mask.mdl" "0 0 30" "1.0"

[face]