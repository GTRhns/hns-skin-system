; =====================================================
;  DLC 第三人称刀皮映射配置
;  DLC Knife 3rd-Person Mapping Configuration
; =====================================================
; 
; 本插件扩展 HnsSkin 刀皮系统，为每个刀皮指定独立的第三人称显示模型。
; 配置文件放在 addons/amxmodx/configs/mixsystem/dlc_knife3p.ini
; 模型文件放在 cstrike/models/ 目录下
;
; 依赖（按顺序加载）：
;   1. addon_weapon_player_model.amxx  (提供 api_wpn_player_model_set)
;   2. HnsSkin.amxx                    (提供第一人称刀皮)
;   3. HnsDlcKnife3P.amxx              (本插件)
;
; =====================================================
;  [Knife3P] - 刀皮第三人称映射
; =====================================================
; 格式: "刀皮名称" "第一人称模型路径" "第三人称模型路径"
;
; - 刀皮名称: 仅用于显示，需与 player_models.ini [Knife] 段保持一致方便识别
; - 第一人称模型路径: 玩家自己看到的刀模型 (v_*)，必须与 player_models.ini 中
;   [Knife] 段配置的路径完全一致
; - 第三人称模型路径: 别人看到的刀模型 (p_*)，由服主手动指定
;
; ★ 第三人称模型路径留空 "" 时，自动按 v_knife → p_knife 转换 ★
;
; 示例:
;   "默认刀" "models/v_knife.mdl" "models/p_knife.mdl"
;   "龙爪"   "models/weapons/v_knife_dragon.mdl" "models/weapons/p_knife_dragon.mdl"
;   "炎刃"   "models/weapons/v_knife_flame.mdl" "models/weapons/p_knife_flame.mdl"

[Knife3P]

; 默认刀皮，第三人称自动转 p_knife
"默认刀" "models/v_knife.mdl" "models/p_knife.mdl"

; 下面为示例，按需取消注释并填写你自己的模型
; "龙爪"   "models/weapons/v_knife_dragon.mdl" "models/weapons/p_knife_dragon.mdl"
; "炎刃"   "models/weapons/v_knife_flame.mdl"  "models/weapons/p_knife_flame.mdl"
; "冰魄"   "models/weapons/v_knife_ice.mdl"    "models/weapons/p_knife_ice.mdl"