; =====================================================
;  DLC 皮肤音效扩展配置
;  DLC Skin Sound Extension Configuration
; =====================================================
; 
; 本插件扩展 HnsSkin 皮肤系统，为指定模型添加自定义音效。
; 配置文件放在 addons/amxmodx/configs/mixsystem/dlc_skin.ini
; 音效文件放在 cstrike/sound/ 目录下（建议统一放在 sound/dlc/ 目录）
;
; =====================================================
;  [DeathSounds] - 玩家死亡音效
; =====================================================
; 格式: "玩家模型路径" "死亡音效文件路径"
; 玩家模型路径必须与 player_models.ini 中的路径一致
; 死亡音效路径相对于 sound/ 目录
;
; ★ 支持同一个模型配多个死亡音效 ★
; 同一个模型可以写多行，死亡时会随机选一个播放！
;
; 示例:
;   "models/player/arctic/arctic.mdl" "dlc/death_arctic1.wav"
;   "models/player/arctic/arctic.mdl" "dlc/death_arctic2.wav"
;   "models/player/arctic/arctic.mdl" "dlc/death_arctic3.wav"
;   "models/player/terror/terror.mdl" "dlc/death_terror1.wav"
;   "models/player/terror/terror.mdl" "dlc/death_terror2.wav"
;   "models/player/leet/leet.mdl" "dlc/death_leet.wav"
;   "models/player/guerilla/guerilla.mdl" "dlc/death_guerilla.wav"
;   "models/player/gsg9/gsg9.mdl" "dlc/death_gsg9.wav"
;   "models/player/gign/gign.mdl" "dlc/death_gign.wav"
;   "models/player/sas/sas.mdl" "dlc/death_sas.wav"
;   "models/player/urban/urban.mdl" "dlc/death_urban.wav"

[DeathSounds]

; =====================================================
;  [KnifeSounds] - 刀击音效
; =====================================================
; 格式: "刀模型路径" "挥砍音效" "击中音效" "重击音效"
; 刀模型路径必须与 player_models.ini 中 [Knife] 下的路径一致
; 所有音效路径相对于 sound/ 目录
; 如果不想替换某个音效，填 "" 即可
;
; 参数说明:
;   参数1: 挥砍音效 (鼠标左键挥刀时播放)
;   参数2: 击中音效 (刀砍到人/墙时播放)
;   参数3: 重击音效 (鼠标右键重击时播放)
;
; 示例:
;   "models/v_knife.mdl" "dlc/knife_slash.wav" "dlc/knife_hit.wav" "dlc/knife_stab.wav"

[KnifeSounds]