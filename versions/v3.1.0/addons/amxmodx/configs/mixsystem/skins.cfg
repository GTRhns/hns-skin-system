; ============================================================
;   HNS 皮肤系统 - 皮肤池配置文件 (TT/CT 分区块, 两行式)
; ------------------------------------------------------------
;  全局设置区块 (放在文件最前面, 大小写无所谓):
;    [SETTINGS]
;    rent_days  30     ; 金币购买获得的租期天数, 0 = 直接永久
;    upgrade_price 2000 ; 把已购限时皮肤升级为永久的价格 (ICGB金币)
;
;  配置分两大区块, 各自下面的行归对应阵营:
;    [TT]  下面的每一款都是 恐怖分子(T) 款
;    [CT]  下面的每一款都是 反恐精英(CT) 款
;
;  每款皮肤占"两行":
;    第一行:  名字  模型路径  价格
;    第二行:  wav 音效路径            (可选, 属于上一款)
;
;  字段含义:
;    名字     皮肤唯一标识, 菜单里显示的就是它, 全服唯一(绝不能重复!)
;    模型     相对 models/ 的路径, 如 models/ddsct/ddsct.mdl
;    价格     ICGB 金币, 0=免费 (购买后获得 rent_days 天租期)
;    wav      死亡音效, 相对 sound/ 的路径, 可多个款复用同一个;
;             这一行不写 = 该款没有死亡音效
;
;  玩家机制:
;    - 购买 = 租期 (默认30天, 到期自动失效, 可重新购买)
;    - /skin 菜单里可花 upgrade_price 金币把租期皮肤升级为永久
;    - 管理员 /cpm 发放 = 直接永久
;
;  想加皮肤: 在对应区块下复制两行改一下名字/模型/价格/音效即可,
;  无限添加 (受服务器模型预缓存上限约束, 大概 512 个)。
;
;  注意:
;    - 名字必须唯一, 不能出现两个一样的名字!
;    - 名字一旦定下别改, 否则玩家已购买的记录会丢失
;    - 模型文件必须真实存在, 否则该款预缓存失败、不进池
;    - 音效文件放到 cstrike/sound/ 对应目录
;    - 玩家是 T 就只用/显示 [TT] 里的款; 是 C 就只用/显示 [CT] 里的款
;    - 修改后换图/重启生效
; ============================================================

[SETTINGS]
rent_days  30
upgrade_price 2000

[TT]
; 李娜: T 款, 300 金币, 死亡音效 misc/ddsct.wav
李娜  models/ddsct/ddsct.mdl  300
      wav misc/ddsct.wav

; 小美: T 款, 免费, 无死亡音效(不写 wav 行)
小美  models/xiaomei/xiaomei.mdl  0

[CT]
; 阿明: CT 款, 300 金币, 死亡音效可复用 misc/ddsct.wav
阿明  models/ddsct/ddsct.mdl  300
      wav misc/ddsct.wav

; 老王: CT 款, 800 金币, 专属死亡音效
老王  models/laowang/laowang.mdl  800
      wav misc/laowang_death.wav
